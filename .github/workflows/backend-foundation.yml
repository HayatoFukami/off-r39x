name: Backend foundation

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: r39x_test
          POSTGRES_HOST_AUTH_METHOD: trust # disposable test service only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d r39x_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Enable verified TLS on disposable PostgreSQL 17
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          openssl req -new -x509 -nodes -days 2 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/pg-test.key" -out "$RUNNER_TEMP/pg-test.crt" >/dev/null 2>&1
          docker cp "$RUNNER_TEMP/pg-test.key" "$PG_CONTAINER:/var/lib/postgresql/data/server.key"
          docker cp "$RUNNER_TEMP/pg-test.crt" "$PG_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker exec -u root "$PG_CONTAINER" sh -c 'chown postgres:postgres /var/lib/postgresql/data/server.key /var/lib/postgresql/data/server.crt && chmod 600 /var/lib/postgresql/data/server.key'
          docker exec -u postgres "$PG_CONTAINER" psql -d r39x_test -c "ALTER SYSTEM SET ssl = on"
          docker exec -u postgres "$PG_CONTAINER" psql -d r39x_test -c "ALTER SYSTEM SET timezone = 'UTC'"
          docker exec -u postgres "$PG_CONTAINER" psql -d r39x_test -c "ALTER SYSTEM SET max_connections = 110"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres -d r39x_test; then break; fi
            sleep 1
          done
          docker exec "$PG_CONTAINER" pg_isready -U postgres -d r39x_test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries && pnpm validate:traceability && pnpm validate:migrations
      - name: Foundation unit, API, security, PG17 and reliability checks
        run: pnpm test:unit && pnpm test:backend
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/r39x_test
          TEST_DATABASE_CA: ${{ runner.temp }}/pg-test.crt
      - run: pnpm build:backend
      - run: pnpm secret-scan --build-dir dist --require-build
      # Deliberately no deployment: this slice is not the completed G1–G10 system gate.
      # Live Neon Auth/proxy, provider smoke and business workers still block promotion.
